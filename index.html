<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Provisioning</title>
    <style>
        /* Import the softer, approachable font */
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap');

        /* Warmer, Softer Dark Mode Aesthetics */
        :root {
            --bg-color: #181719; 
            --surface-color: #242226; 
            --text-primary: #F2F0ED; 
            --text-secondary: #9B99A0; 
            --accent-color: #FFFFFF;
            --border-color: rgba(255, 255, 255, 0.08); 
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif; 
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden; /* Prevents iOS rubber-banding */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Progress Bar */
        #progress-container {
            width: 100%;
            height: 4px;
            background: var(--surface-color);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        #progress-bar {
            height: 100%;
            width: 25%;
            background: var(--accent-color);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Slide Container */
        #slides-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            opacity: 0;
            pointer-events: none;
            transform: translateX(50px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .slide.previous {
            transform: translateX(-50px);
        }

        /* Typography */
        h1 { 
            font-size: 1.85rem; 
            font-weight: 400; 
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem; 
            text-align: center; 
        }
        
        p.subtitle { 
            color: var(--text-secondary); 
            font-size: 1.05rem;
            font-weight: 300;
            margin-bottom: 2.5rem; 
            text-align: center; 
        }

        /* Floating Pill Inputs */
        input[type="text"], input[type="number"] {
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--border-color);
            border-radius: 20px; 
            color: var(--text-primary);
            font-size: 1.25rem;
            padding: 1.2rem 1.5rem; 
            text-align: center;
            width: 100%;
            max-width: 400px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); 
        }
        
        input[type="text"]:focus, input[type="number"]:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.05); 
            transform: translateY(-2px); 
        }
        
        input { font-size: 16px !important; /* iOS auto-zoom prevention */ }

        /* Buttons */
        .btn-primary {
            background: var(--text-primary);
            color: var(--bg-color);
            border: none;
            padding: 1.2rem 2rem;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-top: 1.5rem;
            transition: transform 0.2s;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }

        /* Color Swatches */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }
        .swatch {
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            text-align: center;
            font-weight: 400;
            transition: all 0.2s ease;
        }
        .swatch:hover { 
            transform: translateY(-2px); 
            border-color: rgba(255,255,255,0.2);
        }

        /* Menu Builders */
        .menu-presets {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            max-width: 400px;
            margin-bottom: 1.5rem;
        }
        .preset-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 300;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            transition: background 0.2s;
        }
        .preset-btn:hover { background: rgba(255, 255, 255, 0.06); }

        .custom-menu-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
            width: 100%;
            max-width: 400px;
        }
        .custom-menu-row input[type="text"] { flex: 2; font-size: 1.1rem; text-align: left; border-radius: 12px; padding: 1rem; }
        .custom-menu-row input[type="number"] { flex: 1; font-size: 1.1rem; text-align: right; border-radius: 12px; padding: 1rem; }

        /* Loader */
        .loader {
            width: 40px; height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="progress-container"><div id="progress-bar"></div></div>

    <div id="slides-container">
        <!-- Slide 1: Identity (With Next Button Fix) -->
        <div class="slide active" id="slide-1">
            <h1>What is your food truck's name?</h1>
            <p class="subtitle">Let's set up your digital kitchen.</p>
            <input type="text" id="truck-name" placeholder="e.g., Bite Street Tacos" autocomplete="off" autofocus>
            <button class="btn-primary" onclick="submitSlide1()">Next</button>
        </div>

        <!-- Slide 2: Aesthetics -->
        <div class="slide" id="slide-2">
            <h1>Which aesthetic matches your vibe?</h1>
            <p class="subtitle">This dictates your portal's UI.</p>
            <div class="color-grid">
                <div class="swatch" style="background:#1A1A1A; color:#fff;" onclick="selectTheme('Obsidian Black', '#1A1A1A')">Obsidian Black</div>
                <div class="swatch" style="background:#40464F; color:#fff;" onclick="selectTheme('Slate Grey', '#40464F')">Slate Grey</div>
                <div class="swatch" style="background:#6B7062; color:#fff;" onclick="selectTheme('Matte Sage', '#6B7062')">Matte Sage</div>
                <div class="swatch" style="background:#EAE8E3; color:#181719; border-color:#d0cdc5;" onclick="selectTheme('Clean Slate', '#EAE8E3')">Clean Slate</div>
            </div>
        </div>

        <!-- Slide 3: The Product -->
        <div class="slide" id="slide-3">
            <h1>List your top 3 sellers.</h1>
            <p class="subtitle">Choose a preset or type your own.</p>
            
            <div class="menu-presets">
                <button class="preset-btn" onclick="selectPreset('mexican')">
                    <span>🌮 Mexican Street Food</span><span style="color:var(--text-secondary)">Use Preset</span>
                </button>
                <button class="preset-btn" onclick="selectPreset('american')">
                    <span>🍔 Smashburger Classic</span><span style="color:var(--text-secondary)">Use Preset</span>
                </button>
                <button class="preset-btn" onclick="selectPreset('asian')">
                    <span>🥡 Asian Fusion</span><span style="color:var(--text-secondary)">Use Preset</span>
                </button>
            </div>

            <div style="width:100%; max-width:400px; text-align:center; margin-bottom:1rem; color:var(--text-secondary); text-transform:uppercase; font-size:0.75rem; letter-spacing:1px; font-weight:500;">Or Custom Entry</div>

            <div class="custom-menu-row">
                <input type="text" class="custom-name" placeholder="Item 1">
                <input type="number" class="custom-price" placeholder="$0.00" step="0.50" inputmode="decimal">
            </div>
            <div class="custom-menu-row">
                <input type="text" class="custom-name" placeholder="Item 2">
                <input type="number" class="custom-price" placeholder="$0.00" step="0.50" inputmode="decimal">
            </div>
            <div class="custom-menu-row">
                <input type="text" class="custom-name" placeholder="Item 3">
                <input type="number" class="custom-price" placeholder="$0.00" step="0.50" inputmode="decimal">
            </div>
            
            <button class="btn-primary" onclick="submitCustomMenu()">Build My System</button>
        </div>

        <!-- Slide 4: Processing Handoff -->
        <div class="slide" id="slide-4">
            <div class="loader"></div>
            <h1 id="loading-text">Compiling Kitchen Display...</h1>
        </div>
    </div>

    <script>
        const systemData = {
            truckName: "",
            themeName: "",
            themeColor: "",
            menu: []
        };

        const presets = {
            mexican: [
                { name: "Al Pastor Taco", price: "4.50" },
                { name: "Carne Asada Burrito", price: "12.00" },
                { name: "Street Corn (Esquites)", price: "5.00" }
            ],
            american: [
                { name: "Double Smashburger", price: "11.00" },
                { name: "Truffle Parm Fries", price: "6.50" },
                { name: "Vanilla Bean Shake", price: "5.00" }
            ],
            asian: [
                { name: "Pork Belly Bao (2)", price: "9.00" },
                { name: "Spicy Peanut Noodles", price: "13.00" },
                { name: "Thai Iced Tea", price: "4.50" }
            ]
        };

        let currentSlide = 1;

        function goToSlide(step) {
            document.getElementById(`slide-${currentSlide}`).classList.remove('active');
            document.getElementById(`slide-${currentSlide}`).classList.add('previous');
            currentSlide = step;
            document.getElementById(`slide-${currentSlide}`).classList.add('active');
            document.getElementById('progress-bar').style.width = `${(step / 4) * 100}%`;
        }

        // Slide 1 Logic - Handles Button Click
        function submitSlide1() {
            const inputField = document.getElementById('truck-name');
            systemData.truckName = inputField.value.trim() || "My Food Truck";
            inputField.blur(); // Hides keyboard on iOS
            goToSlide(2);
        }

        // Fallback for Enter key
        document.getElementById('truck-name').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitSlide1();
            }
        });

        // Slide 2 Logic
        function selectTheme(name, hex) {
            systemData.themeName = name;
            systemData.themeColor = hex;
            goToSlide(3);
        }

        // Slide 3 Logic - Presets
        function selectPreset(type) {
            systemData.menu = presets[type];
            finalizeSystem();
        }

        // Slide 3 Logic - Custom
        function submitCustomMenu() {
            const names = document.querySelectorAll('.custom-name');
            const prices = document.querySelectorAll('.custom-price');
            
            for(let i=0; i<3; i++) {
                if(names[i].value.trim() !== '') {
                    systemData.menu.push({
                        name: names[i].value.trim(),
                        price: prices[i].value || "0.00"
                    });
                }
            }

            if(systemData.menu.length === 0) systemData.menu = presets['mexican'];
            finalizeSystem();
        }

        // Final Handoff
        function finalizeSystem() {
            goToSlide(4);
            localStorage.setItem('demo_config', JSON.stringify(systemData));
            
            const textElement = document.getElementById('loading-text');
            setTimeout(() => { textElement.innerText = "Provisioning Customer Portal..."; }, 1000);
            setTimeout(() => { textElement.innerText = "Syncing Local Storage Engine..."; }, 2000);
            setTimeout(() => { 
                textElement.innerText = "System Ready. Redirecting."; 
                // Redirects to your Customer Portal
                window.location.href = "index.html"; 
            }, 3000);
        }
    </script>
</body>
</html>
