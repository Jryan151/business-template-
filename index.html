<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Provisioning</title>
    <style>
        /* Sleek Neutral / Dark Mode Aesthetics */
        :root {
            --bg-color: #0f1115; /* Deep Charcoal */
            --surface-color: #1a1d24; /* Elevated Slate */
            --text-primary: #f8f9fa;
            --text-secondary: #8b92a5;
            --accent-color: #ffffff;
            --border-color: #2d313a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow: hidden; /* Prevents scrolling, forces focus */
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Progress Bar */
        #progress-container {
            width: 100%;
            height: 4px;
            background: var(--surface-color);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
        }
        #progress-bar {
            height: 100%;
            width: 25%;
            background: var(--accent-color);
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Slide Container */
        #slides-container {
            flex: 1;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            opacity: 0;
            pointer-events: none;
            transform: translateX(50px);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .slide.previous {
            transform: translateX(-50px);
        }

        /* Typography & Inputs */
        h1 { font-size: 1.75rem; font-weight: 500; margin-bottom: 0.5rem; text-align: center; }
        p.subtitle { color: var(--text-secondary); margin-bottom: 2rem; text-align: center; }

        input[type="text"], input[type="number"] {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--border-color);
            color: var(--text-primary);
            font-size: 1.5rem;
            padding: 0.5rem;
            text-align: center;
            width: 100%;
            max-width: 400px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus, input[type="number"]:focus {
            border-bottom-color: var(--accent-color);
        }
        
        /* Mobile zoom prevention */
        input { font-size: 16px !important; }

        /* Color Swatches (Neutral/Modern) */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 400px;
        }
        .swatch {
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            text-align: center;
            font-weight: 500;
            transition: transform 0.2s;
        }
        .swatch:hover { transform: translateY(-2px); }

        /* Menu Builders */
        .menu-presets {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            width: 100%;
            max-width: 400px;
            margin-bottom: 2rem;
        }
        .preset-btn {
            background: var(--surface-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 1rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }
        .preset-btn:hover { border-color: var(--text-secondary); }

        .custom-menu-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            width: 100%;
            max-width: 400px;
        }
        .custom-menu-row input[type="text"] { flex: 2; font-size: 1.2rem; text-align: left; }
        .custom-menu-row input[type="number"] { flex: 1; font-size: 1.2rem; text-align: right; }

        .btn-primary {
            background: var(--text-primary);
            color: var(--bg-color);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            margin-top: 1rem;
        }

        /* Loader */
        .loader {
            width: 40px; height: 40px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="progress-container"><div id="progress-bar"></div></div>

    <div id="slides-container">
        <!-- Slide 1: Identity -->
        <div class="slide active" id="slide-1">
            <h1>What is your food truck's name?</h1>
            <p class="subtitle">Press Enter to continue</p>
            <input type="text" id="truck-name" placeholder="e.g., Bite Street Tacos" autocomplete="off" autofocus>
        </div>

        <!-- Slide 2: Aesthetics -->
        <div class="slide" id="slide-2">
            <h1>Select your brand theme.</h1>
            <p class="subtitle">This dictates your portal's UI.</p>
            <div class="color-grid">
                <div class="swatch" style="background:#20232a; color:#fff;" onclick="selectTheme('Obsidian Black', '#20232a')">Obsidian Black</div>
                <div class="swatch" style="background:#4a5568; color:#fff;" onclick="selectTheme('Slate Grey', '#4a5568')">Slate Grey</div>
                <div class="swatch" style="background:#78866b; color:#fff;" onclick="selectTheme('Sage Matte', '#78866b')">Sage Matte</div>
                <div class="swatch" style="background:#c07c65; color:#fff;" onclick="selectTheme('Terracotta', '#c07c65')">Terracotta</div>
            </div>
        </div>

        <!-- Slide 3: The Product -->
        <div class="slide" id="slide-3">
            <h1>Add your top 3 sellers.</h1>
            <p class="subtitle">Choose a preset or type your own.</p>
            
            <div class="menu-presets">
                <button class="preset-btn" onclick="selectPreset('mexican')">
                    <span>🌮 Mexican Street Food</span><span style="color:var(--text-secondary)">Use Preset</span>
                </button>
                <button class="preset-btn" onclick="selectPreset('american')">
                    <span>🍔 Smashburger Classic</span><span style="color:var(--text-secondary)">Use Preset</span>
                </button>
                <button class="preset-btn" onclick="selectPreset('asian')">
                    <span>🥡 Asian Fusion</span><span style="color:var(--text-secondary)">Use Preset</span>
                </button>
            </div>

            <div style="width:100%; max-width:400px; text-align:center; margin-bottom:1rem; color:var(--text-secondary); text-transform:uppercase; font-size:0.8rem; letter-spacing:1px;">Or Custom Entry</div>

            <div class="custom-menu-row">
                <input type="text" class="custom-name" placeholder="Item 1">
                <input type="number" class="custom-price" placeholder="$0.00" step="0.50">
            </div>
            <div class="custom-menu-row">
                <input type="text" class="custom-name" placeholder="Item 2">
                <input type="number" class="custom-price" placeholder="$0.00" step="0.50">
            </div>
            <div class="custom-menu-row">
                <input type="text" class="custom-name" placeholder="Item 3">
                <input type="number" class="custom-price" placeholder="$0.00" step="0.50">
            </div>
            
            <button class="btn-primary" onclick="submitCustomMenu()">Build My System</button>
        </div>

        <!-- Slide 4: Processing Handoff -->
        <div class="slide" id="slide-4">
            <div class="loader"></div>
            <h1 id="loading-text">Compiling Kitchen Display...</h1>
        </div>
    </div>

    <script>
        // Central Data Object
        const systemData = {
            truckName: "",
            themeName: "",
            themeColor: "",
            menu: []
        };

        const presets = {
            mexican: [
                { name: "Al Pastor Taco", price: "4.50" },
                { name: "Carne Asada Burrito", price: "12.00" },
                { name: "Street Corn (Esquites)", price: "5.00" }
            ],
            american: [
                { name: "Double Smashburger", price: "11.00" },
                { name: "Truffle Parm Fries", price: "6.50" },
                { name: "Vanilla Bean Shake", price: "5.00" }
            ],
            asian: [
                { name: "Pork Belly Bao (2)", price: "9.00" },
                { name: "Spicy Peanut Noodles", price: "13.00" },
                { name: "Thai Iced Tea", price: "4.50" }
            ]
        };

        let currentSlide = 1;

        function goToSlide(step) {
            document.getElementById(`slide-${currentSlide}`).classList.remove('active');
            document.getElementById(`slide-${currentSlide}`).classList.add('previous');
            currentSlide = step;
            document.getElementById(`slide-${currentSlide}`).classList.add('active');
            document.getElementById('progress-bar').style.width = `${(step / 4) * 100}%`;
        }

        // Slide 1 Logic
        document.getElementById('truck-name').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                systemData.truckName = this.value.trim() || "My Food Truck";
                this.blur(); // dismiss mobile keyboard
                goToSlide(2);
            }
        });

        // Slide 2 Logic
        function selectTheme(name, hex) {
            systemData.themeName = name;
            systemData.themeColor = hex;
            goToSlide(3);
        }

        // Slide 3 Logic - Presets
        function selectPreset(type) {
            systemData.menu = presets[type];
            finalizeSystem();
        }

        // Slide 3 Logic - Custom
        function submitCustomMenu() {
            const names = document.querySelectorAll('.custom-name');
            const prices = document.querySelectorAll('.custom-price');
            
            for(let i=0; i<3; i++) {
                if(names[i].value.trim() !== '') {
                    systemData.menu.push({
                        name: names[i].value.trim(),
                        price: prices[i].value || "0.00"
                    });
                }
            }

            // Fallback if they hit submit while empty
            if(systemData.menu.length === 0) systemData.menu = presets['mexican'];
            
            finalizeSystem();
        }

        // Final Handoff
        function finalizeSystem() {
            goToSlide(4);
            
            // Write the payload to browser memory
            localStorage.setItem('demo_config', JSON.stringify(systemData));
            
            // Processing Sequence Illusion
            const textElement = document.getElementById('loading-text');
            setTimeout(() => { textElement.innerText = "Provisioning Customer Portal..."; }, 1000);
            setTimeout(() => { textElement.innerText = "Syncing Local Storage Engine..."; }, 2000);
            setTimeout(() => { 
                textElement.innerText = "System Ready. Redirecting."; 
                // NEXT STEP: Uncomment this when you build the demo portal
                // window.location.href = "demo.html";
                console.log("Payload saved to localStorage:", JSON.parse(localStorage.getItem('demo_config')));
            }, 3000);
        }
    </script>
</body>
</html>
