<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordering Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Walkthrough Tooltip Engine CSS */
        .wt-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(2px);
            z-index: 9998; display: none; pointer-events: none;
        }
        .wt-tooltip {
            position: fixed; z-index: 10000; background: #FFFFFF; color: #181719;
            padding: 1rem 1.25rem; border-radius: 12px; font-size: 0.9rem; font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 280px; display: none;
            flex-direction: column; gap: 0.5rem; pointer-events: auto; font-family: sans-serif;
            border: 2px solid #pink-500; /* Fallback border, gets overwritten by brand color */
        }
        .wt-tooltip-header { font-weight: 700; font-size: 1.05rem; color: #000; }
        .wt-tooltip-btn { 
            background: #181719; color: #fff; border: none; padding: 0.5rem; 
            border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; font-size: 0.8rem; mt: 0.5rem;
        }
        /* The spotlight class elevates an element above the dark overlay */
        .wt-spotlight { position: relative; z-index: 9999 !important; border-radius: inherit; }
        .wt-spotlight-pulse { animation: wtPulse 2s infinite; }
        @keyframes wtPulse { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen pb-20 flex flex-col justify-between" id="appBody">
    
    <!-- Walkthrough Elements -->
    <div class="wt-overlay" id="wtOverlay"></div>
    <div class="wt-tooltip" id="wtTooltip">
        <div class="wt-tooltip-header" id="wtTitle">Welcome!</div>
        <div id="wtText">Let's walk through your new system.</div>
        <button class="wt-tooltip-btn" id="wtNextBtn" onclick="wtNextStep()">Got it</button>
    </div>

    <div class="max-w-md mx-auto w-full flex-grow">
        <!-- Landing View -->
        <div id="landingView" class="p-6 flex flex-col items-center justify-center min-h-[90vh] text-center">
            <div class="w-24 h-24 rounded-full border-2 border-pink-500 p-1 mb-4 flex items-center justify-center shadow-lg shadow-pink-500/10">
                <span class="text-4xl" id="dynamic-emoji">🌮</span>
            </div>
            <h1 id="dynamic-truck-name" class="text-3xl font-serif font-bold italic tracking-wide mb-1">Storefront</h1>
            <p id="dynamic-subheader" class="text-zinc-400 text-sm mb-3">Fresh Local Eats</p>
            
            <div class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-3 mb-4 text-left shadow-md">
                <div class="flex justify-between items-center mb-1">
                    <label class="text-[11px] text-zinc-400 font-medium">📍 Active Truck Location (Click to Map):</label>
                </div>
                <div id="activeLocationDisplay" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-2.5 text-xs text-zinc-300 font-medium"></div>
            </div>

            <div id="storeStatusBadge" class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-4 py-2 text-xs mb-6 text-emerald-400 flex items-center gap-2 w-full justify-center">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="storeStatusText">Open Now • Until 6:00 PM</span>
            </div>

            <div class="w-full space-y-3">
                <button onclick="switchView('menu')" id="btn-start-order" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3.5 rounded-xl transition shadow-lg shadow-pink-600/25">Start Order</button>
            </div>

            <div class="mt-12 text-center" id="ig-container" style="display:none;">
                <a href="#" target="_blank" id="dynamic-ig-link" class="text-xs text-pink-500 hover:text-pink-400 tracking-wider font-medium flex items-center justify-center gap-1.5"><span>📷</span> @<span id="dynamic-ig-text">username</span></a>
            </div>
        </div>

        <!-- Menu View -->
        <div id="menuView" class="p-4 hidden">
            <div class="flex items-center justify-between mb-4 sticky top-0 bg-zinc-950/90 backdrop-blur py-2 z-10 border-b border-zinc-900">
                <button onclick="switchView('landing')" class="text-zinc-400 text-sm hover:text-white">← Back</button>
                <h2 class="font-bold text-lg">Order Menu</h2>
                <div class="w-10"></div>
            </div>
            
            <div class="bg-gradient-to-r from-pink-950/40 to-amber-950/40 border border-pink-500/30 rounded-xl p-3 mb-5 text-xs">
                <div class="font-bold text-pink-400 mb-1 flex items-center gap-1"><span>🔥</span> Popular Item Highlights</div>
                <div id="popularHighlightsContainer" class="grid grid-cols-3 gap-2 text-center mt-2"></div>
            </div>

            <div id="menuContainer" class="space-y-6"></div>
            
            <div class="fixed bottom-4 left-4 right-4 max-w-md mx-auto">
                <button onclick="openCartModal()" id="btn-view-cart" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 rounded-xl shadow-xl flex justify-between px-5 items-center transition-all">
                    <span id="cartCountBadge" class="bg-pink-700 px-2 py-0.5 rounded-md text-xs font-bold">0 items</span>
                    <span>View Cart</span>
                    <span id="cartTotalBadge">$0.00</span>
                </button>
            </div>
        </div>

        <!-- Tracker View (Simplified for Walkthrough) -->
        <div id="trackerView" class="p-4 hidden">
            <h2 class="font-bold text-lg mb-4 text-center border-b border-zinc-900 pb-2">Order Tracker</h2>
            <div class="space-y-3" id="activeOrdersList"></div>
            <button onclick="window.location.href='owner.html'" id="btn-route-owner" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3.5 rounded-xl transition shadow-lg mt-6 hidden">Enter Owner Backend →</button>
        </div>
    </div>

    <!-- Item Modal -->
    <div id="itemModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 space-y-4 relative" id="modal-content-box">
            <div class="flex justify-between items-center"><h3 id="itemModalTitle" class="font-bold text-lg text-pink-400">Add to Order</h3><button onclick="closeItemModal()" class="text-zinc-400 hover:text-white text-sm">✕</button></div>
            
            <div id="itemModalMeatSection" class="hidden">
                <label class="block text-xs text-zinc-400 mb-1 font-medium">Select Meat/Protein</label>
                <select id="itemMeatSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200"></select>
            </div>

            <div id="itemModalTortillaSection" class="hidden">
                <label class="block text-xs text-zinc-400 mb-1 font-medium">Modification Option</label>
                <select id="itemTortillaSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200">
                    <option value="">Standard</option>
                    <option value="Premium Add-on">Premium Add-on (+$1.00)</option>
                </select>
            </div>

            <div id="itemModalDrinkSection" class="hidden">
                <label class="block text-xs text-zinc-400 mb-1 font-medium">Select Flavor Option</label>
                <select id="itemDrinkSelect" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200"></select>
            </div>

            <div>
                <label class="block text-xs text-zinc-400 mb-1 font-medium">Quantity</label>
                <div class="flex items-center gap-3">
                    <button onclick="adjustModalQty(-1)" class="w-10 h-10 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-base font-bold flex items-center justify-center">-</button>
                    <span id="itemModalQty" class="text-lg font-mono font-bold flex-1 text-center">1</span>
                    <button onclick="adjustModalQty(1)" class="w-10 h-10 bg-zinc-800 hover:bg-zinc-700 rounded-xl text-base font-bold flex items-center justify-center">+</button>
                </div>
            </div>
            <button onclick="confirmAddToCart()" id="btn-confirm-add" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-pink-600/20">Confirm & Add to Cart</button>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto" id="cart-content-box">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3"><h3 class="font-bold text-lg">Your Order Cart</h3><button onclick="closeCartModal()" class="text-zinc-400 hover:text-white text-sm">✕</button></div>
            
            <div id="cartWaitTimeContainer" class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-2.5 flex items-center justify-between text-xs">
                <span class="text-amber-400 font-medium">⏱️ Dynamic Wait Time:</span>
                <span id="cartEstimatedWait" class="font-bold text-amber-400 font-mono">0 mins</span>
            </div>

            <div id="cartItemsList" class="space-y-3"></div>
            
            <div class="space-y-3 pt-2 border-t border-zinc-800">
                <div><label class="block text-xs text-zinc-400 mb-1">Your Name</label><input type="text" id="customerName" placeholder="Enter name for order" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm text-zinc-200"></div>
            </div>
            <button onclick="submitOrder()" id="btn-place-order" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 rounded-xl transition">Place Test Order</button>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 w-full max-w-sm rounded-2xl p-6 text-center space-y-4">
            <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 rounded-full flex items-center justify-center mx-auto text-2xl">✓</div>
            <h3 class="font-bold text-lg text-zinc-100">Order Placed!</h3>
            <div class="bg-zinc-950 p-4 rounded-xl border border-zinc-800 space-y-1">
                <div class="text-xs text-zinc-400">Assigned Ticket Number:</div>
                <div id="successTicketNum" class="text-2xl font-mono font-bold text-pink-500">#000</div>
            </div>
            <button onclick="closeSuccessModal()" id="btn-view-tracker" class="w-full bg-pink-600 hover:bg-pink-500 text-white font-semibold py-3 rounded-xl text-sm transition">View Tracker & Continue</button>
        </div>
    </div>

    <script>
        const app = {
            cart: [],
            orders: [],
            menu: [],
            config: null,
            wtActive: false,
            wtStep: 0
        };

        // CORE ENGINE SETUP
        function applyDemoConfig() {
            const configData = localStorage.getItem('demo_config');
            if (!configData) return false;
            
            app.config = JSON.parse(configData);
            const c = app.config;

            // Apply Branding
            if (c.truckName) {
                document.getElementById('dynamic-truck-name').innerText = c.truckName;
                document.title = c.truckName + " - Order";
            }
            if (c.cuisineSubheader) document.getElementById('dynamic-subheader').innerText = c.cuisineSubheader;
            if (c.cuisineEmoji) document.getElementById('dynamic-emoji').innerText = c.cuisineEmoji;
            
            if (c.ownerIG) {
                document.getElementById('ig-container').style.display = 'block';
                document.getElementById('dynamic-ig-text').innerText = c.ownerIG;
                document.getElementById('dynamic-ig-link').href = `https://instagram.com/${c.ownerIG}`;
            }

            // Apply Strict Menu
            if (c.menu && c.menu.length > 0) {
                app.menu = c.menu.map((item, index) => {
                    item.id = index + 1;
                    item.category = "⭐ " + (c.truckName || "Signature") + " Menu";
                    return item;
                });
            }

            // Apply Theme & Contrast Fixes
            if (c.themeClass) document.body.classList.add(c.themeClass);
            if (c.themeColor) {
                document.documentElement.style.setProperty('--brand-color', c.themeColor);
                document.documentElement.style.setProperty('--brand-color-shadow', c.themeColor + '40');
                
                let extraCSS = '';
                // Contrast overrides based on class rules
                if (c.themeClass === 'theme-cleanslate') {
                    // Force buttons black and text white on light theme
                    extraCSS += `
                        .bg-pink-600 { background-color: #111 !important; color: #fff !important; }
                        .hover\\:bg-pink-500:hover { background-color: #000 !important; }
                        .text-pink-500, .text-pink-400 { color: #111 !important; }
                        .border-pink-500 { border-color: #111 !important; }
                        /* Specific fixes for buttons requested */
                        #btn-start-order, #btn-view-cart, #btn-confirm-add, #btn-place-order, .btn-add-item { 
                            background-color: #111 !important; color: #fff !important; border: 1px solid #333;
                        }
                    `;
                } else if (c.themeClass === 'theme-slate') {
                    // Force prices white
                    extraCSS += `
                        .menu-item-price { color: #ffffff !important; font-weight: bold; }
                        .bg-pink-600 { background-color: var(--brand-color) !important; }
                        .text-pink-500, .text-pink-400 { color: #fff !important; }
                    `;
                } else if (c.themeClass === 'theme-obsidian') {
                    // Highlight IG link and Headers
                    extraCSS += `
                        #dynamic-ig-link { color: #E1306C !important; font-weight: bold; }
                        .bg-pink-600 { background-color: #fff !important; color: #000 !important; }
                        h3.text-pink-500 { color: #fff !important; border-bottom: 1px solid #333; padding-bottom: 4px;}
                        .text-pink-400 { color: #ddd !important; }
                    `;
                } else {
                    // Default generic theme injection
                    extraCSS += `
                        .bg-pink-600 { background-color: var(--brand-color) !important; }
                        .hover\\:bg-pink-500:hover { background-color: var(--brand-color) !important; filter: brightness(1.15); }
                        .text-pink-500, .text-pink-400 { color: var(--brand-color) !important; }
                        .border-pink-500 { border-color: var(--brand-color) !important; }
                    `;
                }

                const style = document.createElement('style');
                style.innerHTML = extraCSS;
                document.head.appendChild(style);
                
                // Color the tooltip border to match brand
                document.getElementById('wtTooltip').style.borderColor = c.themeClass === 'theme-cleanslate' ? '#000' : c.themeColor;
            }
            return true;
        }

        // WALKTHROUGH ENGINE
        const walkthroughSteps = [
            { // Step 0
                trigger: () => {
                    const name = app.config?.ownerName || "Partner";
                    wtShow(`Welcome, ${name}!`, "Your digital storefront is live. Let's act like a customer and place a test order so you can see how the backend automation works.", "btn-start-order");
                },
                action: () => { document.getElementById('btn-start-order').click(); }
            },
            { // Step 1
                trigger: () => {
                    // Find the first button to add an item
                    const firstAddBtn = document.querySelector('.btn-add-item');
                    if(firstAddBtn) {
                        firstAddBtn.id = 'wt-target-add-btn';
                        wtShow("Smart Menu Structure", "Notice the prep times on each item. The system uses these to calculate live wait times. Click 'Add' to see the modifier engine.", "wt-target-add-btn");
                    } else { wtNextStep(); } // skip if empty
                },
                action: () => { document.getElementById('wt-target-add-btn').click(); }
            },
            { // Step 2
                trigger: () => {
                    wtShow("Upcharges & Logic", "If an item has premium proteins or modifications, the system automatically adjusts the price before it hits the cart. Confirm and add this item.", "btn-confirm-add");
                },
                action: () => { document.getElementById('btn-confirm-add').click(); }
            },
            { // Step 3
                trigger: () => {
                    wtShow("Dynamic Cart", "The cart icon now tracks their total. Let's check out.", "btn-view-cart");
                },
                action: () => { document.getElementById('btn-view-cart').click(); }
            },
            { // Step 4
                trigger: () => {
                    // Auto-fill name for them to speed up demo
                    document.getElementById('customerName').value = app.config?.ownerName || "Test Customer";
                    wtShow("Wait Time Calculation", "Look at the top. The system added up the prep times of the items to give the customer an exact wait estimate. Click Place Order.", "btn-place-order");
                },
                action: () => { document.getElementById('btn-place-order').click(); }
            },
            { // Step 5
                trigger: () => {
                    wtShow("Ticket Generation", "Success! The system collected the money and generated a ticket. Let's see the customer tracker.", "btn-view-tracker");
                },
                action: () => { document.getElementById('btn-view-tracker').click(); }
            },
            { // Step 6
                trigger: () => {
                    document.getElementById('btn-route-owner').classList.remove('hidden');
                    wtShow("Backend Handoff", "The customer now waits here to see when their food is ready. Now, let's jump to your Kitchen Display to fulfill this order.", "btn-route-owner");
                },
                action: () => { document.getElementById('btn-route-owner').click(); }
            }
        ];

        function wtShow(title, text, targetId) {
            app.wtActive = true;
            document.getElementById('wtOverlay').style.display = 'block';
            
            const tooltip = document.getElementById('wtTooltip');
            document.getElementById('wtTitle').innerText = title;
            document.getElementById('wtText').innerText = text;
            
            // Remove old spotlight
            document.querySelectorAll('.wt-spotlight').forEach(el => {
                el.classList.remove('wt-spotlight', 'wt-spotlight-pulse');
            });

            const target = document.getElementById(targetId);
            if (target) {
                target.classList.add('wt-spotlight', 'wt-spotlight-pulse');
                
                // Position tooltip near target (simplified center-ish positioning for mobile)
                tooltip.style.display = 'flex';
                tooltip.style.top = '20%';
                tooltip.style.left = '50%';
                tooltip.style.transform = 'translate(-50%, 0)';
                
                // Override target click to intercept walkthrough flow
                target.onclick = (e) => {
                    e.preventDefault();
                    walkthroughSteps[app.wtStep].action();
                    wtNextStep();
                };
            }
        }

        function wtNextStep() {
            app.wtStep++;
            document.getElementById('wtTooltip').style.display = 'none';
            if (app.wtStep < walkthroughSteps.length) {
                setTimeout(() => { walkthroughSteps[app.wtStep].trigger(); }, 300);
            } else {
                app.wtActive = false;
                document.getElementById('wtOverlay').style.display = 'none';
            }
        }

        function startWalkthrough() {
            // Check if this is a fresh setup from the intake form
            if (localStorage.getItem('demo_config') && !localStorage.getItem('wt_completed_customer')) {
                // Clear cart just in case
                app.cart = [];
                updateCartBadges();
                app.wtStep = 0;
                setTimeout(() => { walkthroughSteps[0].trigger(); }, 500);
                localStorage.setItem('wt_completed_customer', 'true'); // Flag to not run again on refresh
            }
        }


        // STANDARD UI FUNCTIONS
        function switchView(view) {
            if(app.wtActive && view !== 'menu') return; // Block manual nav during WT
            
            ['landingView', 'menuView', 'trackerView'].forEach(v => {
                const el = document.getElementById(v);
                if (el) el.style.display = 'none';
            });
            if (view === 'landing') document.getElementById('landingView').style.display = 'flex';
            if (view === 'menu') { document.getElementById('menuView').style.display = 'block'; renderMenu(); }
            if (view === 'tracker') { document.getElementById('trackerView').style.display = 'block'; renderTracker(); }
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const highlights = document.getElementById('popularHighlightsContainer');
            if (!container) return;
            
            if (app.menu.length === 0) {
                container.innerHTML = "<div class='text-center text-zinc-500'>Menu loading...</div>";
                return;
            }

            // Render Highlights (First 3 items)
            if (highlights) {
                const labels = ["TOP ITEM", "POPULAR", "FAVORITE"];
                highlights.innerHTML = app.menu.slice(0,3).map((item, idx) => `
                    <div onclick="openItemModal(${item.id})" class="bg-zinc-950/60 p-2 rounded-lg border border-zinc-800 cursor-pointer transition">
                        <span class="text-[9px] text-zinc-400 block font-semibold">${labels[idx]}</span>
                        <span class="font-bold text-zinc-200 text-[11px] truncate block text-pink-400">${item.name}</span>
                    </div>
                `).join('');
            }

            // Render List
            const categories = [...new Set(app.menu.map(i => i.category))];
            container.innerHTML = categories.map(cat => `
                <div>
                    <h3 class="font-bold text-pink-500 mb-3 text-sm">${cat}</h3>
                    <div class="space-y-3">
                        ${app.menu.filter(i => i.category === cat).map(item => `
                            <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex justify-between items-center">
                                <div>
                                    <h4 class="font-bold text-sm">${item.name}</h4>
                                    <p class="text-xs text-zinc-400 mt-0.5">${item.desc}</p>                                     <div class="flex items-center gap-3 mt-2">                                         <span class="text-sm font-semibold text-pink-500 menu-item-price">$${item.price.toFixed(2)}</span>
                                        <span class="text-[10px] text-zinc-500">(~${item.prep})</span>
                                    </div>
                                </div>
                                <button onclick="openItemModal(${item.id})" class="btn-add-item bg-pink-600 hover:bg-pink-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold h-8 min-w-[55px] shadow">Add +</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            updateCartBadges();
        }

        let currentModalItem = null;
        let currentModalQtyVal = 1;

        function openItemModal(id) {
            if(app.wtActive && id !== 1) return; // Force them to pick item 1 in WT
            
            const item = app.menu.find(m => m.id === id);
            currentModalItem = item;
            currentModalQtyVal = 1;
            document.getElementById('itemModalQty').innerText = currentModalQtyVal;
            document.getElementById('itemModalTitle').innerText = `Add ${item.name}`;

            const meatSec = document.getElementById('itemModalMeatSection');
            const tortillaSec = document.getElementById('itemModalTortillaSection');
            const drinkSec = document.getElementById('itemModalDrinkSection');

            // Reset logic
            meatSec.classList.add('hidden');
            tortillaSec.classList.add('hidden');
            drinkSec.classList.add('hidden');

            if (item.meats) {
                meatSec.classList.remove('hidden');
                const meatOptions = item.meats.split(',').map(m => m.trim());
                document.getElementById('itemMeatSelect').innerHTML = meatOptions.map(m => {
                    let isUpcharge = '';
                    // Generic upcharge check for walkthrough purposes (e.g., Shrimp or Bacon)
                    if (item.camaronUpcharge && (m.toLowerCase().includes('camaron') || m.toLowerCase().includes('premium') || m.toLowerCase().includes('bacon'))) {
                        isUpcharge = ` (+$${item.camaronUpcharge.toFixed(2)})`;
                    }
                    return `<option value="${m}">${m}${isUpcharge}</option>`;
                }).join('');
            }

            if (item.hasFlourTortillaOption) {
                tortillaSec.classList.remove('hidden');
            }

            if (item.options) {
                drinkSec.classList.remove('hidden');
                document.getElementById('itemDrinkSelect').innerHTML = item.options.map(o => `<option value="${o}">${o}</option>`).join('');
            }

            document.getElementById('itemModal').style.display = 'flex';
            
            // If in WT, jump to step 2 automatically if the modal opens
            if (app.wtActive && app.wtStep === 1) { wtNextStep(); }
        }

        function closeItemModal() {
            if(app.wtActive) return; // Disable closing in WT
            document.getElementById('itemModal').style.display = 'none';
        }

        function adjustModalQty(delta) {
            currentModalQtyVal += delta;
            if (currentModalQtyVal < 1) currentModalQtyVal = 1;
            document.getElementById('itemModalQty').innerText = currentModalQtyVal;
        }

        function confirmAddToCart() {
            if (!currentModalItem) return;
            let itemName = currentModalItem.name;
            let itemUpcharge = 0;

            if (currentModalItem.meats) {
                const meat = document.getElementById('itemMeatSelect').value;
                if (currentModalItem.camaronUpcharge && (meat.toLowerCase().includes('camaron') || meat.toLowerCase().includes('premium') || meat.toLowerCase().includes('bacon'))) {
                    itemUpcharge += currentModalItem.camaronUpcharge;
                }
            }

            if (currentModalItem.hasFlourTortillaOption && document.getElementById('itemTortillaSelect').value !== '') {
                itemUpcharge += 1.00;
            }

            const effectivePrice = currentModalItem.price + itemUpcharge;
            const prepMins = parseInt(currentModalItem.prep) || 3; // fallback to 3 if text parsing fails

            app.cart.push({ name: itemName, price: effectivePrice, quantity: currentModalQtyVal, prep: prepMins });
            
            document.getElementById('itemModal').style.display = 'none';
            updateCartBadges();
        }

        function updateCartBadges() {
            const count = app.cart.reduce((sum, item) => sum + item.quantity, 0);
            const total = app.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('cartCountBadge').innerText = `${count} items`;
            document.getElementById('cartTotalBadge').innerText = `$${total.toFixed(2)}`;
        }

        function openCartModal() {
            if (app.cart.length === 0 && !app.wtActive) return;
            
            const itemsWaitTime = app.cart.reduce((sum, item) => sum + (item.prep * item.quantity), 0);
            document.getElementById('cartEstimatedWait').innerText = `~${itemsWaitTime} mins`;

            document.getElementById('cartItemsList').innerHTML = app.cart.map((item) => `
                <div class="flex justify-between items-center bg-zinc-950 p-3 rounded-xl border border-zinc-800 text-sm">
                    <div>
                        <div class="font-bold">${item.name}</div>
                        <div class="text-xs text-pink-500 font-semibold">$${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                    <span class="text-xs font-mono w-4 text-center">Qty: ${item.quantity}</span>
                </div>
            `).join('');
            
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCartModal() { 
            if(app.wtActive) return; 
            document.getElementById('cartModal').style.display = 'none'; 
        }

        function submitOrder() {
            const ticketId = Date.now().toString().slice(-3);
            let nameInput = document.getElementById('customerName').value.trim() || "Guest";
            const summary = app.cart.map(i => `${i.quantity}x ${i.name}`).join(', ');
            const total = app.cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            
            const newOrder = {
                id: ticketId, name: nameInput, items: summary, status: "Preparing", total, timestamp: Date.now()
            };

            // Save to shared memory for Owner portal to see
            let sharedOrders = JSON.parse(localStorage.getItem('foodtruck_orders')) || [];
            sharedOrders.unshift(newOrder);
            localStorage.setItem('foodtruck_orders', JSON.stringify(sharedOrders));
            
            // Local state for tracker
            app.orders.unshift(newOrder);
            app.cart = []; 
            document.getElementById('cartModal').style.display = 'none'; 
            updateCartBadges(); 

            document.getElementById('successTicketNum').innerText = `#${newOrder.id}`;
            document.getElementById('successModal').style.display = 'flex';
            
            // Set flag so owner portal knows to bypass login
            localStorage.setItem('wt_incoming_demo', 'true');
        }

        function closeSuccessModal() {
            document.getElementById('successModal').style.display = 'none';
            switchView('tracker');
        }

        function renderTracker() {
            const container = document.getElementById('activeOrdersList');
            container.innerHTML = app.orders.map(o => `
                <div class="bg-zinc-900 border border-zinc-800 p-4 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-xs text-pink-500 font-mono font-bold">Ticket #${o.id} • ${o.name}</span>
                        <div class="text-[11px] text-zinc-400 mt-0.5">Kitchen received order.</div>
                        <span class="inline-block mt-2 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-500 border border-amber-500/20">${o.status}</span>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => {
            if (applyDemoConfig()) {
                document.getElementById('activeLocationDisplay').innerText = "Downtown Main Street (Live View)";
                startWalkthrough();
            }
        };
    </script>
</body>
</html>
